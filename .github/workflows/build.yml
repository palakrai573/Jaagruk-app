# Build and test the SIH 26041 submission: android-app, the backend and the dashboard.
#
# Jaagruk-Mobile/ is a separate, experimental Gradle project and is not built here.
#
# Every push and pull request runs the backend suite, the dashboard type-check and build, and the
# Kotlin suites (:core, :ai, :android-app). The Android job then builds the release APKs — one per
# ABI plus a universal one. Pushing a tag like `v1.0.0` publishes them, with SHA-256 sums, to a
# GitHub release.
#
# SIGNING
# Add four repository secrets for a release signed with your own key:
#   ANDROID_KEYSTORE_BASE64    base64 of the keystore    (base64 -w0 jaagruk-release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them android-app/build.gradle.kts signs the release with the debug key on purpose, so the
# APK still sideloads; the file names then say "debugkey" so nobody mistakes it for a store build.
#
# SYNC ENDPOINT
# Set the repository variable JAAGRUK_RELEASE_API_BASE_URL (e.g. https://<your-service>/) to point
# release builds at a hosted backend. Unset, they use https://sync.invalid/ and keep records queued.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc --noEmit, then vite build

  android:
    name: Android tests and release APKs
    needs: [backend, dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to publish a release on a version tag
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # :ai builds vendored llama.cpp natively; pin the NDK and CMake the module declares.
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Decode signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_API_BASE_URL: ${{ vars.JAAGRUK_RELEASE_API_BASE_URL }}
        run: |
          chmod +x gradlew
          ARGS=""
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ARGS="$ARGS -Pjaagruk.keystorePath=$RUNNER_TEMP/release.jks"
            ARGS="$ARGS -Pjaagruk.keystorePassword=$KEYSTORE_PASSWORD"
            ARGS="$ARGS -Pjaagruk.keyAlias=$KEY_ALIAS -Pjaagruk.keyPassword=$KEY_PASSWORD"
          fi
          if [ -n "$RELEASE_API_BASE_URL" ]; then
            ARGS="$ARGS -Pjaagruk.releaseApiBaseUrl=$RELEASE_API_BASE_URL"
          fi
          set -o pipefail
          ./gradlew --no-daemon \
            :core:test :ai:testDebugUnitTest :android-app:testDebugUnitTest \
            :android-app:assembleRelease $ARGS 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          # Gradle does not fail when it cannot strip native libraries; it ships them with
          # debug symbols. That once more than doubled the APK without anything going red.
          if grep -q "Unable to strip" "$RUNNER_TEMP/gradle.log"; then
            echo "::error::Native libraries were packaged unstripped. Check ndkVersion in android-app/build.gradle.kts."
            exit 1
          fi

      - name: Collect APKs
        run: |
          VERSION=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' android-app/build.gradle.kts | head -n1)
          SUFFIX=""
          [ "$HAS_KEYSTORE" = "true" ] || SUFFIX="-debugkey"
          mkdir -p release
          for apk in android-app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -e 's/^android-app-//' -e 's/-release$//')
            cp "$apk" "release/jaagruk-$VERSION-$abi$SUFFIX.apk"
          done
          (cd release && sha256sum *.apk > SHA256SUMS)
          ls -l release

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: '**/build/reports/tests/'
          retention-days: 14

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: jaagruk-apks
          path: release/*
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
