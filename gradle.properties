# --- JVM -------------------------------------------------------------------
# 3 GB is enough for AGP + KSP + Hilt on a 8 GB dev machine. Raise for CI runners.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# --- Gradle behaviour ------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is intentionally off: AGP 8.7 + KSP + Hilt still emit
# incompatibility warnings on some setups, and a green build matters more than
# a few saved seconds.
org.gradle.configuration-cache=false

# --- AndroidX --------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# --- Kotlin ----------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true

# --- KSP -------------------------------------------------------------------
ksp.incremental=true

# --- Jaagruk ---------------------------------------------------------------
# Force :android-app into the build even when no SDK is auto-detected:
#   gradlew -Pjaagruk.forceAndroid=true ...
# Keep it out even when an SDK exists (fast core-only loop):
#   gradlew -Pjaagruk.skipAndroid=true :core:test
