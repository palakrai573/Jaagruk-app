# --- JVM -------------------------------------------------------------------
# 3 GB plus a metaspace ceiling. AGP + KSP + Hilt + a 33-file Kotlin/JVM module
# does not fit comfortably in the 2 GB this project started with, and the symptom
# of running short is a Kotlin daemon that dies mid-compile and leaves a corrupted
# incremental cache rather than a clean error.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# --- Gradle behaviour ------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is intentionally off: AGP + KSP + Hilt still emit
# incompatibility warnings on this setup, and a green build matters more than
# a few saved seconds.
org.gradle.configuration-cache=false

# --- Kotlin ----------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true

# --- KSP -------------------------------------------------------------------
ksp.incremental=true

# --- AndroidX --------------------------------------------------------------
android.useAndroidX=true
# Each library's R class carries only its own resources, which keeps :ai from
# publishing an R class full of the app's ~400 strings.
android.nonTransitiveRClass=true
# android.defaults.buildfeatures.buildconfig is deprecated and redundant here:
# app/build.gradle.kts sets buildFeatures.buildConfig explicitly.

# --- Jaagruk ---------------------------------------------------------------
# Force :ai and :app into the build even when no SDK is auto-detected:
#   gradlew -Pjaagruk.forceAndroid=true ...
# Keep them out even when an SDK exists (fast core-only loop):
#   gradlew -Pjaagruk.skipAndroid=true :core:test
